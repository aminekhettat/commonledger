name: CI — CommonLedger

on:
  push:
    branches: ["main", "develop", "feat/**", "fix/**"]
  pull_request:
    branches: ["main", "develop"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  QT_QPA_PLATFORM: "offscreen"  # Tests Qt sans affichage (CI)

jobs:
  # ── 1. Lint et formatage ──────────────────────────────────────────────────
  lint:
    name: "Lint & Format (ruff)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff — check linting
        run: ruff check core/ tests/ --output-format=github

      - name: Ruff — check formatting
        run: ruff format --check core/ tests/

  # ── 2. Vérification de types ──────────────────────────────────────────────
  typecheck:
    name: "Type Check (mypy)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install deps
        run: |
          pip install mypy types-python-dateutil
          pip install -r requirements.txt

      - name: MyPy — core/
        # Utilise la config de pyproject.toml (overrides par module inclus)
        run: mypy core/ --config-file pyproject.toml

  # ── 3. Sécurité ───────────────────────────────────────────────────────────
  security:
    name: "Security Scan (bandit)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Bandit — core/
        run: bandit -r core/ -ll --skip B101,B603,B607 -f json -o bandit-report.json
        continue-on-error: false

      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  # ── 4. Tests unitaires ────────────────────────────────────────────────────
  tests:
    name: "Tests (pytest + coverage)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          sudo apt-get install -y libgl1 libglib2.0-0 libegl1
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-qt

      - name: Run tests (core only, sans UI)
        # Les paramètres --cov et --cov-fail-under=100 viennent de pyproject.toml
        run: pytest tests/ -m "not integration and not ui" -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            coverage.xml
            htmlcov/

  # ── 5. Vérification de la documentation ──────────────────────────────────
  docs:
    name: "Documentation check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la présence des fichiers docs requis
        run: |
          files=(
            "README.md"
            "CHANGELOG.md"
            "CONTRIBUTING.md"
            "SECURITY.md"
            "LICENSE"
            "docs/manuel_utilisateur.html"
            "requirements-dev.txt"
          )
          missing=0
          for f in "${files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "MANQUANT: $f"
              missing=$((missing+1))
            else
              echo "OK: $f"
            fi
          done
          if [ $missing -gt 0 ]; then
            echo "ERREUR: $missing fichier(s) de documentation manquant(s)"
            exit 1
          fi

      - name: Vérifier que CHANGELOG.md est à jour
        run: |
          # Le CHANGELOG doit mentionner la version courante
          VERSION=$(python -c "import tomllib; d=tomllib.load(open('pyproject.toml','rb')); print(d['project']['version'])")
          if ! grep -q "$VERSION" CHANGELOG.md; then
            echo "ERREUR: La version $VERSION n'est pas dans CHANGELOG.md"
            exit 1
          fi

  # ── 6. Vérification du commit message (Conventional Commits) ─────────────
  commit-lint:
    name: "Commit message format"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check conventional commits
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: ".commitlintrc.json"

  # ── Job final : tout doit passer ─────────────────────────────────────────
  all-checks:
    name: "All checks passed"
    needs: [lint, typecheck, security, tests, docs]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs succeeded
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.typecheck.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ] || \
             [ "${{ needs.tests.result }}" != "success" ] || \
             [ "${{ needs.docs.result }}" != "success" ]; then
            echo "Un ou plusieurs checks ont échoué — push bloqué"
            exit 1
          fi
          echo "Tous les checks sont passés ✅"
