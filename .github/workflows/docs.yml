name: Documentation — pdoc + GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "core/**/*.py"       # Regénérer si le code change
      - "docs/**"            # Ou si les docs manuelles changent
      - ".github/workflows/docs.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-docs:
    name: "Générer la documentation API (pdoc)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installer pdoc et dépendances minimales
        run: |
          pip install pdoc
          # Installer les dépendances du projet pour que pdoc puisse importer core/
          pip install pdfplumber python-docx matplotlib Pillow python-dateutil
          # Stub pour les modules système non disponibles en CI
          pip install PySide6 || true

      - name: Générer la documentation API
        run: |
          python -m pdoc \
            --output-dir docs/api \
            --docformat google \
            --logo "https://raw.githubusercontent.com/aminekhettat/commonledger/main/config/association.example.json" \
            core

      - name: Créer la page d'index globale
        run: |
          cat > docs/api/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="fr">
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0; url=core.html">
            <title>CommonLedger — Documentation API</title>
          </head>
          <body>
            <p>Redirection vers <a href="core.html">la documentation</a>...</p>
          </body>
          </html>
          EOF

      - name: Copier le manuel utilisateur
        run: |
          cp docs/manuel_utilisateur.html docs/api/manuel.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/api/

  deploy-pages:
    name: "Publier sur GitHub Pages"
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
