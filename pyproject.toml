[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

# ============================================================
# Métadonnées du projet
# ============================================================

[project]
name = "commonledger"
version = "0.2.2"
description = "Simplified accounting for non-profit associations — open source, accessible NVDA/JAWS"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Amine Khettat", email = "amine.khettat@blindsystems.org" }
]
keywords = ["accounting", "nonprofit", "association", "accessibility", "nvda", "pdf", "french"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Office/Business :: Financial :: Accounting",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Natural Language :: French",
]
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.10.0",
    "PyMuPDF>=1.23.0",
    "pandas>=2.1.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "matplotlib>=3.8.0",
    "comtypes>=1.2.0",
    "PySide6>=6.6.0",
    "Pillow>=10.0.0",
    "python-dateutil>=2.8.2",
]

[project.urls]
Homepage = "https://github.com/aminekhettat/commonledger"
Repository = "https://github.com/aminekhettat/commonledger"
Issues = "https://github.com/aminekhettat/commonledger/issues"

[project.scripts]
commonledger = "main:main"

# ============================================================
# bump-my-version — Gestion du versioning sémantique
# Usage :
#   bump-my-version bump patch   → 0.1.0 → 0.1.1  (correctif)
#   bump-my-version bump minor   → 0.1.0 → 0.2.0  (nouvelle fonctionnalité)
#   bump-my-version bump major   → 0.1.0 → 1.0.0  (rupture de compatibilité)
# ============================================================
























[tool.bumpversion]
current_version = "0.1.0"
commit = true
tag = true
tag_name = "v{new_version}"
commit_message = "chore: bump version {current_version} → {new_version}"
allow_dirty = false

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "main.py"
search = 'setApplicationVersion("{current_version}")'
replace = 'setApplicationVersion("{new_version}")'

[[tool.bumpversion.files]]
filename = "README.md"
search = "CommonLedger v{current_version}"
replace = "CommonLedger v{new_version}"

[[tool.bumpversion.files]]
filename = "core/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

# ============================================================
# Outils de développement
# ============================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-v",
    "--cov=core",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=65",
]
markers = [
    "integration: tests nécessitant des ressources externes (disque E, réseau)",
    "slow: tests lents (> 5 secondes)",
    "ui: tests de l'interface graphique PySide6",
]

[tool.coverage.run]
source = ["core"]
omit = [
    "*/tests/*",
    "*/ui/*",
    "*/__pycache__/*",
    "*/conftest.py",
    # Modules d'intégration pure (génération Word/PDF/graphiques)
    # Testés via tests d'intégration, pas en CI headless
    "core/reporter/docx_reporter.py",
    "core/reporter/graphiques.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]
show_missing = true
fail_under = 65  # seuil réaliste : docx/graphiques sont exclus (intégration)

# ── Ruff (linter + formatteur) ────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["core", "ui", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "N",    # pep8-naming
    "ANN",  # flake8-annotations (type hints)
    "S",    # bandit (sécurité via ruff)
    "T20",  # no print statements in production
]
ignore = [
    # Annotations — trop verbeux pour un projet en phase alpha
    "ANN001",  # missing arg type annotation
    "ANN002",  # missing *args type annotation
    "ANN003",  # missing **kwargs type annotation
    "ANN201",  # missing return type (public)
    "ANN202",  # missing return type (private)
    "ANN204",  # missing return type (__init__, always None)
    "ANN206",  # missing return type (__new__)
    # Style
    "E501",    # line too long (géré par line-length)
    "E741",    # ambiguous variable name (l, O, I) — accepté dans les lambdas comptables
    "N806",    # variable in function should be lowercase (GUI vars)
    # Sécurité (acceptable dans ce contexte)
    "S101",    # assert usage (OK dans les tests)
    "S110",    # try-except-pass (OK pour des exceptions Word/LO non critiques)
    "S603",    # subprocess call (commandes hardcodées, pas d'input user)
    "T201",    # print statements (acceptables temporairement)
    # Simplifications optionnelles
    "SIM105",  # contextlib.suppress (style uniquement)
    "SIM117",  # single with (lisibilité des mocks de test)
    "B005",    # .strip() with multi-char (OK)
    "B007",    # loop variable not used (OK pour enumerate)
    "B905",    # zip without strict (Python 3.10+ only, ok pour 3.11+)
    "N813",    # camelcase alias (OK pour oxe = OxmlElement)
    "F841",    # local variable assigned but unused (OK dans matplotlib)
]
per-file-ignores = { "tests/**" = ["ANN", "S", "T20", "SIM"] }

[tool.ruff.lint.isort]
known-first-party = ["core", "ui"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ── MyPy (vérification de types) ─────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "tests/",
    "ui/",
    "config/",
    "docs/",
]

[[tool.mypy.overrides]]
module = ["matplotlib.*", "PIL.*", "pdfplumber.*", "fitz.*", "docx.*", "comtypes.*"]
ignore_missing_imports = true

# python-docx n'a pas de stubs complets — les erreurs attr-defined sont
# des faux positifs dus à l'absence de stubs, pas des bugs réels
[[tool.mypy.overrides]]
module = ["core.reporter.docx_reporter"]
ignore_errors = true

# ── Bandit (sécurité) ─────────────────────────────────────────────────────────
# ── pdoc (génération de documentation API) ────────────────────────────────────
# Commande : pdoc --output-dir docs/api --docformat google core
# Résultat  : docs/api/core/*.html — documentation navigable et indexée
# Note      : docs/api/ est dans .gitignore (generé à chaque build CI)
#             La doc live sera publiée sur GitHub Pages via le workflow docs.yml
[tool.pdoc]
# Format des docstrings dans le code source
docformat = "google"

[tool.bandit]
exclude_dirs = ["tests", "ui", "config/assets"]
skips = ["B101", "B603", "B607"]  # assert, subprocess, shell=True autorisés
severity = "medium"

# ── semantic-release (versioning automatique) ─────────────────────────────────
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = [
    "main.py:CommonLedger.*0.1.0",
    "core/__init__.py:__version__",
]
branch = "main"
changelog_file = "CHANGELOG.md"
build_command = ""
upload_to_repository = false
upload_to_release = true
commit_message = "chore(release): v{version} [skip ci]"
tag_format = "v{version}"
major_on_zero = false   # La version majeure N'EST PAS auto-incrémentée
hvcs = "github"

[tool.semantic_release.commit_parser_options]
# Conventional Commits → version bump rules
# fix/chore/docs/style/refactor/test/perf/ci → PATCH
# feat → MINOR
# feat! ou BREAKING CHANGE → MAJOR (uniquement à la demande explicite)
allowed_tags = ["feat", "fix", "chore", "docs", "style", "refactor", "test", "perf", "ci", "build"]
minor_tags = ["feat"]
patch_tags = ["fix", "chore", "docs", "style", "refactor", "test", "perf", "ci", "build"]
